name: Distribution Smoke Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

# Per-process Git configuration, including checkout. No runner user config write.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'

jobs:
  smoke:
    name: Official release acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Bind pinned Windows verification Node
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"SPECFORGE_VERIFICATION_NODE_SOURCE=$((Get-Command node).Source)" >> $env:GITHUB_ENV'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build current workspace in dependency order
        run: bun scripts/build-workspace.ts
      - name: Run actual official platform release acceptance
        env:
          SPECFORGE_PLATFORM_REPORT_DIR: ${{ runner.temp }}/specforge-platform-report
        run: bun scripts/verify-platform-release.ts
      - name: Upload raw platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/specforge-platform-report
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate Results
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform result
        env:
          MATRIX_RESULT: ${{ needs.smoke.result }}
        run: test "$MATRIX_RESULT" = success
